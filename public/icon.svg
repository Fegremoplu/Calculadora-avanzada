<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="220" r="160" fill="url(#glowGrad)" />

  <!-- Calculator Screen Graphic Frame -->
  <rect x="76" y="64" width="360" height="110" rx="22" fill="#020617" stroke="#334155" stroke-width="3" />
  <rect x="86" y="74" width="340" height="90" rx="14" fill="#05101a" />
  
  <!-- Formula on Screen -->
  <text x="106" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#64748b" font-weight="500">f(x) = ∫ sin(x) dx</text>
  <text x="406" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#38bdf8" font-weight="700" text-anchor="end">-cos(x) + C</text>

  <!-- Keypad Grid & Scientific Symbols -->
  <!-- Key 1: sqrt -->
  <rect x="76" y="200" width="76" height="64" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M96 238 L104 238 L114 248 L126 218 L138 218" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Key 2: pi -->
  <rect x="170" y="200" width="76" height="64" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="208" y="242" font-family="serif" font-size="30" fill="#38bdf8" font-weight="bold" text-anchor="middle">π</text>

  <!-- Key 3: x^y -->
  <rect x="265" y="200" width="76" height="64" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="303" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#38bdf8" font-weight="600" text-anchor="middle">xʸ</text>

  <!-- Key 4: sin -->
  <rect x="360" y="200" width="76" height="64" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="398" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#38bdf8" font-weight="600" text-anchor="middle">sin</text>

  <!-- Key Row 2: Digit 7, 8, 9, DIV -->
  <rect x="76" y="280" width="76" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="114" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#f1f5f9" font-weight="600" text-anchor="middle">7</text>

  <rect x="170" y="280" width="76" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="208" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#f1f5f9" font-weight="600" text-anchor="middle">8</text>

  <rect x="265" y="280" width="76" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="303" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#f1f5f9" font-weight="600" text-anchor="middle">9</text>

  <rect x="360" y="280" width="76" height="64" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="398" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#38bdf8" font-weight="600" text-anchor="middle">÷</text>

  <!-- Key Row 3: Digit 4, 5, 6, MULT -->
  <rect x="76" y="360" width="76" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="114" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#f1f5f9" font-weight="600" text-anchor="middle">4</text>

  <rect x="170" y="360" width="76" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="208" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#f1f5f9" font-weight="600" text-anchor="middle">5</text>

  <rect x="265" y="360" width="76" height="64" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="303" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#f1f5f9" font-weight="600" text-anchor="middle">6</text>

  <rect x="360" y="360" width="76" height="64" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="398" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#38bdf8" font-weight="600" text-anchor="middle">×</text>

  <!-- Key Row 4: 0, Dot, EQUALS (Hero button) -->
  <rect x="76" y="440" width="76" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="114" y="473" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#f1f5f9" font-weight="600" text-anchor="middle">0</text>

  <rect x="170" y="440" width="76" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="208" y="473" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#f1f5f9" font-weight="bold" text-anchor="middle">.</text>

  <!-- Equals Key with Gradient & Subtle Glow -->
  <rect x="265" y="440" width="171" height="48" rx="12" fill="url(#accentGrad)" />
  <text x="350" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" fill="#041624" font-weight="bold" text-anchor="middle">=</text>
</svg>
